<section class="p-10 md:p-20 font-parki bg-white">
    <h1 class="text-4xl text-black font-bold text-center pb-6">Contact Me</h1>
  
    <form class="flex flex-col space-y-6 items-center max-w-xl mx-auto" action="your-server-endpoint" method="POST">
      
      <!-- Name -->
      <div class="flex flex-col md:flex-row w-full">
        <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 w-full md:space-x-10">
          <!-- First Name -->
          <div class="flex flex-col space-y-2 w-full">
            <label for="first-name">First Name</label>
            <input id="first-name" name="first_name" class="px-4 py-2 rounded-lg border border-orange-400 focus:outline-none placeholder:text-slate-500" type="text" placeholder="James" required>
          </div>
          <!-- Last Name -->
          <div class="flex flex-col space-y-2 w-full">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="last_name" class="px-4 py-2 rounded-lg border border-orange-400 focus:outline-none placeholder:text-slate-500" type="text" placeholder="Hunter" required>
          </div>
        </div>
      </div>
  
      <!-- Email -->
      <div class="flex flex-col w-full space-y-2">
        <label for="email">Email</label>
        <input id="email" name="email" class="px-4 py-2 rounded-lg border border-orange-400 focus:outline-none" type="email" placeholder="james.hunter@mail.com" required>
      </div>
  
      <!-- Phone -->
      <div class="flex flex-col w-full space-y-2">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" class="px-4 py-2 rounded-lg border border-orange-400 focus:outline-none" type="tel" placeholder="(123) 456-7890">
      </div>
  
      <!-- Message -->
      <div class="flex flex-col w-full space-y-2">
        <label for="message">Message</label>
        <textarea id="message" name="message" class="px-4 py-2 rounded-lg border border-orange-400 focus:outline-none" cols="30" rows="5" placeholder="Your message..." required></textarea>
      </div>
  
      <!-- Submit Button -->
      <button class="bg-orange-400 py-2 px-6 text-black shadow-lg rounded-lg w-full hover:bg-orange-700 hover:text-white duration-150" type="submit">
        Send Message
      </button>
  
    </form>
  </section>
